server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.csr.html index.html;

    # Gzip Compression for fast delivery over mobile networks
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Angular SPA routing: route all paths (e.g. /kowalscy) to index.csr.html
    location / {
        try_files $uri $uri/ /index.csr.html;
    }

    # Proxy /api calls to the Spring Boot backend container
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cache static assets (images, fonts, scripts)
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
}
